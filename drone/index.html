<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Paris Drone Capture — Limoges 3D</title>
<style>
:root{color-scheme:dark;--bg:#090d14;--panel:#121a26;--line:#283548;--gold:#ffc15a;--muted:#9aabc0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#edf3fa;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#view{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;gap:7px;align-items:center;z-index:4;pointer-events:none}
.panel{background:#101824eF;border:1px solid var(--line);border-radius:13px;padding:9px;backdrop-filter:blur(12px);pointer-events:auto}
#search{display:flex;gap:6px;flex:1;min-width:0}input{width:100%;min-width:0;background:#080e17;color:white;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px}
button{background:#202d3e;color:white;border:1px solid #394b62;border-radius:9px;padding:10px 12px;font-weight:650;white-space:nowrap}button.primary{background:var(--gold);color:#17120a;border-color:var(--gold)}button:disabled{opacity:.45}
#info{position:absolute;left:10px;right:10px;top:70px;z-index:3;max-width:520px;pointer-events:none}
#identity{font-weight:750;color:var(--gold);font-size:15px;overflow-wrap:anywhere}#details{color:#c0cddd;font-size:12px;margin-top:4px}
#controls{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:4;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
#controls .panel{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
#status{font-size:12px;color:var(--muted);flex:1;min-width:100px}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#101824dd;padding:12px 16px;border-radius:12px;color:#dce6f2;text-align:center;pointer-events:none;max-width:80%}
#list{position:absolute;right:10px;top:70px;bottom:110px;width:min(250px,48vw);overflow:auto;z-index:3;pointer-events:auto;background:#101824dd;border:1px solid var(--line);border-radius:12px;padding:6px}
.item{display:block;width:100%;text-align:left;margin:3px 0;padding:8px;font-size:11px;white-space:normal}.item small{display:block;color:var(--muted);font-weight:400}
@media(max-width:520px){#top{flex-wrap:wrap}#search{flex-basis:100%}#info{top:116px}#list{top:auto;bottom:112px;max-height:30vh;width:45vw}#controls{gap:5px}#controls .panel{padding:7px}button{padding:9px 10px;font-size:12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"}}</script>
</head>
<body>
<div id="view"></div>
<div id="top"><div id="search" class="panel"><input id="place" value="Hôtel de Ville, Paris" placeholder="Adresse ou lieu à Paris"><button id="load" class="primary">Charger</button></div></div>
<div id="info" class="panel"><div id="identity">Sélectionne un bâtiment</div><div id="details">Identifiants IGN BD TOPO et RNB affichés ici.</div></div>
<div id="list"></div>
<div style="position:absolute;right:10px;top:52px;z-index:2;font-size:10px;color:#fff;background:#101824bb;padding:5px 8px;border-radius:7px;pointer-events:none">Maquette 3D IGN · pas une vidéo de façade réelle</div>
<div id="hint">Chargement de Paris…<br><small>Glisse pour piloter la caméra · touche un bâtiment pour l'identifier</small></div>
<div id="controls"><div class="panel"><button id="orbit" class="primary">▶ Orbite auto</button><button id="record">● REC vidéo</button><button id="stop" disabled>■ Stop</button><button id="meta">Exporter fiche JSON</button></div><div class="panel"><button id="closer">＋</button><button id="farther">－</button><button id="reset">Recentrer</button><span id="status">Prêt</span></div></div>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const WFS='https://data.geopf.fr/wfs/ows';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bb2c7);scene.fog=new THREE.Fog(0x9bb2c7,500,1800);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.2,5000);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdcecff,0x526071,2.0));
const sun=new THREE.DirectionalLight(0xffedcf,2.5);sun.position.set(-180,260,120);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(5000,5000),new THREE.MeshStandardMaterial({color:0x65796c,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-1;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(1200,60,0x758a9b,0x758a9b);grid.position.y=-.8;scene.add(grid);
let meshes=[],features=[],selected=null,center={lon:2.3522,lat:48.8566},target=new THREE.Vector3(0,15,0),radius=90,az=0.8,el=.45,auto=false,recorder=null,chunks=[],lastBlob=null;
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
function local(lon,lat){const x=(lon-center.lon)*111320*Math.cos(center.lat*Math.PI/180);const z=-(lat-center.lat)*111320;return [x,z]}
function addRing(shape,ring,holes){if(!ring||ring.length<4)return;const p=ring.map(c=>local(c[0],c[1]));shape.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)shape.lineTo(p[i][0],p[i][1]);}
function featurePolys(g){if(g.type==='Polygon')return [g.coordinates];if(g.type==='MultiPolygon')return g.coordinates;return []}
function buildFeature(f){const p=f.properties||{},h=Math.max(4,Number(p.hauteur)||((Number(p.nombre_d_etages)||3)*3.1));const mat=new THREE.MeshStandardMaterial({color:0xc8b9a5,roughness:.88,metalness:0.02});let made=[];
for(const poly of featurePolys(f.geometry)){if(!poly[0]||poly[0].length<4)continue;const pts=poly[0].map(c=>local(c[0],c[1]));const s=new THREE.Shape();s.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)s.lineTo(pts[i][0],pts[i][1]);s.closePath();for(let j=1;j<poly.length;j++){const hp=poly[j].map(c=>local(c[0],c[1]));const hole=new THREE.Path();hole.moveTo(hp[0][0],hp[0][1]);for(let i=1;i<hp.length;i++)hole.lineTo(hp[i][0],hp[i][1]);hole.closePath();s.holes.push(hole)}
const geo=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:false,curveSegments:1});geo.rotateX(-Math.PI/2);geo.computeVertexNormals();const mesh=new THREE.Mesh(geo,mat.clone());mesh.material.color.setHex((p.usage_1||'').includes('Résidentiel')?0xcbbba4:0xb5b9bd);mesh.castShadow=true;mesh.receiveShadow=true;mesh.userData.feature=f;scene.add(mesh);meshes.push(mesh);made.push(mesh)}
return made}
function clear(){for(const m of meshes){scene.remove(m);m.geometry.dispose();m.material.dispose()}meshes=[];features=[];selected=null;$('list').innerHTML=''}
async function geocode(q){const u='https://data.geopf.fr/geocodage/search?'+new URLSearchParams({q:q+', Paris',limit:'1'});const d=await(await fetch(u)).json();const f=d.features&&d.features[0];if(!f)throw Error('Adresse introuvable');return f.geometry.coordinates}
async function loadCity(){auto=false;$('orbit').textContent='▶ Orbite auto';$('hint').style.display='block';$('hint').textContent='Récupération des bâtiments IGN…';$('status').textContent='Chargement…';try{const xy=await geocode($('place').value.trim());center={lon:xy[0],lat:xy[1]};const pad=.0018;const params={SERVICE:'WFS',VERSION:'2.0.0',REQUEST:'GetFeature',TYPENAMES:'BDTOPO_V3:batiment',OUTPUTFORMAT:'application/json',SRSNAME:'EPSG:4326',COUNT:'500',BBOX:[center.lat-pad,center.lon-pad,center.lat+pad,center.lon+pad].join(',')+',urn:ogc:def:crs:EPSG::4326',PROPERTYNAME:'cleabs,identifiants_rnb,hauteur,usage_1,nombre_d_etages,geometrie'};const url=WFS+'?'+new URLSearchParams(params);const d=await(await fetch(url)).json();if(!d.features||!d.features.length)throw Error('Aucun bâtiment dans cette zone');clear();features=d.features;for(const f of features)buildFeature(f);target.set(0,0,0);radius=95;az=.8;el=.45;updateCamera();renderList();if(features.length)select(features[0]);$('hint').style.display='none';$('status').textContent=features.length+' bâtiments chargés';}catch(e){$('hint').textContent='Erreur : '+e.message;$('status').textContent='Échec du chargement'}}
function renderList(){const frag=document.createDocumentFragment();features.forEach((f,i)=>{const p=f.properties||{},b=document.createElement('button');b.className='item';b.innerHTML='Bâtiment '+(i+1)+'<small>'+String(p.identifiants_rnb||p.cleabs||'ID absent')+'</small>';b.onclick=()=>select(f);frag.appendChild(b)});$('list').replaceChildren(frag)}
function select(f){selected=f;const p=f.properties||{};for(const m of meshes){const yes=m.userData.feature===f;m.material.color.setHex(yes?0xffbd59:((m.userData.feature.properties.usage_1||'').includes('Résidentiel')?0xcbbba4:0xb5b9bd))}const r=featurePolys(f.geometry)[0]?.[0]||[];if(r.length){const c=r.reduce((a,v)=>[a[0]+v[0]/r.length,a[1]+v[1]/r.length],[0,0]);const q=local(c[0],c[1]);target.set(q[0],Math.max(5,(Number(p.hauteur)||20)*.48),q[1]);radius=Math.max(28,Math.min(110,(Number(p.hauteur)||20)*2.5));updateCamera()}$('identity').textContent='ID-RNB : '+(p.identifiants_rnb||'non renseigné');$('details').textContent='IGN cleabs : '+(p.cleabs||'—')+' · '+(p.usage_1||'Usage inconnu')+' · '+(p.hauteur||'hauteur inconnue')+' m · '+(p.nombre_d_etages||'?')+' étages';[...$('list').children].forEach((b,i)=>b.style.borderColor=features[i]===f?'#ffc15a':'#394b62')}
function updateCamera(){const d=Math.cos(el)*radius;camera.position.set(target.x+Math.sin(az)*d,target.y+Math.sin(el)*radius,target.z+Math.cos(az)*d);camera.lookAt(target)}
function tick(){requestAnimationFrame(tick);if(auto){az+=.0017;updateCamera()}renderer.render(scene,camera)}tick();
function down(e){const rect=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(meshes);if(hits.length)select(hits[0].object.userData.feature)}
renderer.domElement.addEventListener('click',down);
let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,az,el};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;az=drag.az-(e.clientX-drag.x)*.008;el=Math.max(.08,Math.min(1.35,drag.el+(e.clientY-drag.y)*.006));updateCamera()});renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('wheel',e=>{radius=Math.max(12,Math.min(500,radius+e.deltaY*.12));updateCamera()},{passive:true});
$('load').onclick=loadCity;$('place').addEventListener('keydown',e=>{if(e.key==='Enter')loadCity()});
$('orbit').onclick=()=>{auto=!auto;$('orbit').textContent=auto?'Ⅱ Pause orbite':'▶ Orbite auto'};
$('closer').onclick=()=>{radius=Math.max(12,radius*.78);updateCamera()};$('farther').onclick=()=>{radius=Math.min(500,radius*1.28);updateCamera()};$('reset').onclick=()=>{az=.8;el=.45;radius=90;updateCamera()};
$('record').onclick=()=>{try{const stream=renderer.domElement.captureStream(30);const mime=['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime)throw Error('Enregistrement vidéo non pris en charge par ce navigateur');chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{lastBlob=new Blob(chunks,{type:mime});const url=URL.createObjectURL(lastBlob);const a=document.createElement('a');a.href=url;a.download='paris-drone-'+Date.now()+'.'+(mime.includes('mp4')?'mp4':'webm');a.textContent='Ouvrir / enregistrer la vidéo';a.style.cssText='position:absolute;z-index:8;bottom:90px;left:50%;transform:translateX(-50%);background:#ffc15a;color:#17120a;padding:12px;border-radius:10px';document.body.appendChild(a);a.onclick=()=>setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent='Vidéo prête · '+Math.round(lastBlob.size/1e6)+' Mo'};recorder.start(1000);$('record').disabled=true;$('stop').disabled=false;$('status').textContent='● Enregistrement 30 i/s';}catch(e){$('status').textContent=e.message}};
$('stop').onclick=()=>{if(recorder&&recorder.state!=='inactive')recorder.stop();$('record').disabled=false;$('stop').disabled=true};
$('meta').onclick=()=>{if(!selected){$('status').textContent='Sélectionne un bâtiment';return}const p=selected.properties||{};const data={captured_at:new Date().toISOString(),city:'Paris',source:'IGN BD TOPO V3',license:'Licence Ouverte 2.0',id_ign_cleabs:p.cleabs||null,id_rnb:p.identifiants_rnb||null,usage:p.usage_1||null,height_m:p.hauteur||null,floors:p.nombre_d_etages||null,center_wgs84:center,geometry:selected.geometry};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='batiment-'+(p.identifiants_rnb||p.cleabs||'paris')+'.json';a.click();URL.revokeObjectURL(a.href)};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
loadCity();
</script>
</body></html>
