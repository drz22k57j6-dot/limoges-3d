<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moteur de sol — aperçu des éléments</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#t{position:fixed;left:16px;top:12px;color:#fff;font:600 20px -apple-system,Helvetica,sans-serif;text-shadow:0 1px 4px #000}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }</script>
</head><body><div id="t"></div>
<script type="module">
// Aperçu isolé : un élément du moteur de sol à la fois (?el=0..8), posé sur la bonne matière de voirie.
import * as THREE from 'three';
import { createMoteurSol } from './moteur.js';
import { createVoirie } from '../commun/voirie.js';
const el = +(new URLSearchParams(location.search).get('el') || 0);
const R = new THREE.WebGLRenderer({ antialias: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); R.setSize(innerWidth, innerHeight);
R.toneMapping = THREE.AgXToneMapping; R.shadowMap.enabled = true; document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color(0x9fb4c8);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 200);
const sun = new THREE.DirectionalLight(0xfff2e0, 3.2); sun.position.set(3, 9, -6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); S.add(sun, new THREE.HemisphereLight(0x8fa6c4, 0x6b6150, 1.1));
const MS = createMoteurSol(THREE); MS.abandon = el === 4 || el === 5 ? 0.9 : 0.25;
const VO = createVoirie(THREE, { base: '../data/tex/voirie/', sol: MS });
// sol : chaussée (z < 0), bordure (0..0.22), trottoir (z > 0.22), hauteur +14 cm
function dalle(id, x0, x1, z0, z1, y, auxf) {
  const g = new THREE.PlaneGeometry(x1 - x0, z1 - z0, 40, 40); g.rotateX(-Math.PI / 2); g.translate((x0 + x1) / 2, y, (z0 + z1) / 2);
  const p = g.attributes.position, uv = g.attributes.uv, aux = new Float32Array(p.count * 2), S0 = { 0: 3, 1: 2.5, 2: 1.2, 3: 3, 4: 1.2 }[id];
  for (let i = 0; i < p.count; i++) { uv.setXY(i, p.getX(i) / S0, -p.getZ(i) / S0); const a = auxf ? auxf(p.getX(i), p.getZ(i)) : [0, 0]; aux[2 * i] = a[0]; aux[2 * i + 1] = a[1]; }
  g.setAttribute('aux', new THREE.BufferAttribute(aux, 2));
  const m = new THREE.Mesh(g, VO.material(id)); m.receiveShadow = true; S.add(m); return m;
}
const W = 14;
dalle(0, -W, W, -W, 0, 0, (x, z) => [Math.min(-z, 9), 0]);                // chaussée, aux.x = distance à la bordure
dalle(2, -W, W, 0, 0.22, 0.145);                                            // dessus de bordure
dalle(1, -W, W, 0.22, W, 0.14);                                             // trottoir
{ const f = new THREE.PlaneGeometry(2 * W, 0.15, 60, 1); f.rotateY(Math.PI); f.translate(0, 0.07, 0); const a = new Float32Array(f.attributes.position.count * 2), uv = f.attributes.uv;
  for (let i = 0; i < a.length / 2; i++) { const x = f.attributes.position.getX(i), y = f.attributes.position.getY(i); a[2 * i] = x + W; a[2 * i + 1] = y; uv.setXY(i, (x + W) / 1.2, y / 1.2); }
  f.setAttribute('aux', new THREE.BufferAttribute(a, 2)); const m = new THREE.Mesh(f, VO.material(2)); m.receiveShadow = true; S.add(m); }   // face de bordure (côté chaussée), aux = (le long, hauteur)
if (el === 7) dalle(4, -W, W, 3, W, 0.145);                                // pavés
if (el === 10) dalle(3, -1.5, 1.5, -6, 0, 0.006, (x, z) => [x, z]);       // passage piéton (bandes de 50 cm)
const mur = new THREE.Mesh(new THREE.BoxGeometry(2 * W, 6, 1), new THREE.MeshStandardMaterial({ color: 0xd9cdb6, roughness: 0.9 }));
mur.position.set(0, 3.14, 4.4); mur.castShadow = mur.receiveShadow = true; if (el < 6 || el === 9) S.add(mur);
// un faux secteur avec les éléments voulus (même format que sol_details.wasm)
const items = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [] };
const A = a => Math.round(((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / (2 * Math.PI) * 255);
const add = (k, x, y, z, a, v = 0, t = 0, s = 100) => items[k].push([x, z, y, A(a), v, t, s]);
if (el === 0) add(0, 0, 0, -0.13, Math.PI / 2);                             // bouche d'égout : pied de bordure, tournée vers la bordure (+z)
if (el === 1) { add(1, -0.6, 0, -2.2, 0.3, 0); add(1, 1.2, 0.14, 1.6, 1, 1); }
if (el === 2) { add(2, -0.7, 0.14, 1.5, Math.PI / 2, 0); add(2, 0.8, 0.14, 1.9, Math.PI / 2, 1); }
if (el === 3) add(3, 0, 0.14, 1.6, 0);
if (el === 9) add(6, 0, 0.14, 3.9, -Math.PI / 2);
if (el === 10) { for (let x = -1.2; x < 1.3; x += 0.4) add(7, x, 0.14, 0.45, -Math.PI / 2); }
if (el === 4) for (let x = -6; x < 6; x += 0.5 + Math.random() * 0.5) add(4, x, 0.14, 3.75 + Math.random() * 0.12, Math.PI / 2, Math.floor(Math.random() * 4), Math.floor(Math.random() * 120), 70 + Math.random() * 70);
if (el === 5) for (let x = -6; x < 6; x += 0.6 + Math.random() * 0.8) add(5, x, 0, -0.1, Math.PI / 2, Math.floor(Math.random() * 4), Math.floor(Math.random() * 120), 50 + Math.random() * 50);
const x0 = -500, z0 = -500, y0 = -10, parts = [];
for (const k in items) {
  const L = items[k], b = new ArrayBuffer(8 + L.length * 10), dv = new DataView(b); dv.setUint32(0, +k, true); dv.setUint32(4, L.length, true);
  L.forEach((e, i) => { const o = 8 + i * 10; dv.setUint16(o, Math.round((e[0] - x0) / 1000 * 65535), true); dv.setUint16(o + 2, Math.round((e[1] - z0) / 1000 * 65535), true); dv.setInt16(o + 4, Math.round((e[2] - y0) * 100), true); dv.setUint8(o + 6, e[3]); dv.setUint8(o + 7, e[4]); dv.setUint8(o + 8, e[5]); dv.setUint8(o + 9, e[6]); });
  parts.push(new Uint8Array(b));
}
const head = new ArrayBuffer(20), hv = new DataView(head); hv.setUint32(0, 0x444C4F53, true); hv.setUint32(4, parts.length, true); hv.setFloat32(8, x0, true); hv.setFloat32(12, z0, true); hv.setFloat32(16, y0, true);
const all = new Uint8Array(20 + parts.reduce((s, p) => s + p.length, 0)); all.set(new Uint8Array(head)); let o = 20; for (const p of parts) { all.set(p, o); o += p.length; }
for (const m of MS.construire(all.buffer)) S.add(m);
const VUES = [
  ['Bouche d\'égout (avaloir) dans le caniveau', [0.9, 1.3, -1.8], [0, 0, -0.2]],
  ['Regards en fonte (chaussée et trottoir)', [2.6, 2.6, -4.5], [0.3, 0, -0.3]],
  ['Plaques de réseaux sur le trottoir', [0.1, 2.2, -0.9], [0, 0, 1.7]],
  ['Grille d\'arbre en fonte', [1.6, 2.3, -0.6], [0, 0, 1.8]],
  ['Herbes sauvages au pied des murs', [1.5, 1.5, 0.6], [-0.5, 0.2, 3.8]],
  ['Herbes dans le caniveau', [1.8, 1.1, -1.9], [-0.5, 0.05, 0]],
  ['Trottoir : variantes, joints, usure', [0, 6, -1], [0, 0, 7]],
  ['Pavés de granit', [0.5, 2.4, 1.2], [0, 0, 5]],
  ['Chaussée : enrobés, reprises, caniveau', [2, 7, -12], [0, 0, -3]],
  ['Passage de porte cochère (quadrillage)', [1.2, 2.6, 0.4], [0, 0, 3.4]],
  ['Bande d\'éveil de vigilance (passage piéton)', [1.2, 1.8, -1.6], [0, 0, 0.4]],
];
const [titre, p, c] = VUES[el]; document.getElementById('t').textContent = titre;
cam.position.set(...p); cam.lookAt(...c);
R.setAnimationLoop(() => { MS.majCamera({ x: cam.position.x, y: 1, z: cam.position.z }); R.render(S, cam); });
window.__pret = true;
</script></body></html>
