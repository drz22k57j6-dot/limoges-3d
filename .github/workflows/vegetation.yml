name: Génération végétation Paris

on:
  workflow_dispatch:
  push:
    paths:
      - "outils/vegetation/demande.txt"

permissions:
  contents: write

concurrency:
  group: vegetation-paris
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/appart-studio-runtime-lidar-vegetation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install requests shapely pyproj
      - name: Générer les données
        run: python3 outils/vegetation/vegetation.py
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paris/vegetation/ outils/vegetation/rapport.md
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Génère les données de végétation de Paris"
          for attempt in 1 2 3; do
            git pull --rebase origin feat/appart-studio-runtime-lidar-vegetation && git push origin HEAD:feat/appart-studio-runtime-lidar-vegetation && exit 0
            echo "Échec push, essai $attempt/3"
            sleep $((attempt * 5))
          done
          exit 1
