name: Analyse visuelle des façades rue Cler

on:
  workflow_dispatch:
  push:
    paths:
      - "outils/photos/analyse_demande.txt"

permissions:
  contents: write

concurrency:
  group: photos-analyse-cler-main
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Installer Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
      - name: Installer les dépendances Python (PyTorch CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install requests pillow numpy transformers pyproj pytesseract
      - name: Analyser les façades
        run: python3 outils/photos/analyse.py
      - name: Publier les images redressées comme artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redressees
          path: redressees/
          if-no-files-found: warn
          retention-days: 7
      - name: Commit et push des mesures
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paris/facades_photos/cler.json outils/photos/analyse_cler.md
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git commit -m "data: analyse visuelle des façades rue Cler"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push échoué (essai \${attempt}/3)." >&2
            sleep $((attempt * 2))
          done
          echo "Impossible de pousser après 3 essais." >&2
          exit 1
