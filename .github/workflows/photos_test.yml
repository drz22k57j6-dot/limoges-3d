name: Test couverture photo rue Cler

on:
  workflow_dispatch:
  push:
    paths:
      - "outils/photos/demande.txt"

permissions:
  contents: write

concurrency:
  group: photos-cler-main
  cancel-in-progress: false

jobs:
  couverture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Installer les dépendances
        run: python -m pip install requests pyproj
      - name: Mesurer la couverture
        env:
          MAPILLARY_TOKEN: \${{ secrets.MAPILLARY_TOKEN }}
        run: python3 outils/photos/couverture.py
      - name: Commit et push des rapports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outils/photos/rapport_cler.json outils/photos/rapport_cler.md
          if git diff --cached --quiet; then
            echo "Aucun changement dans les rapports."
            exit 0
          fi
          git commit -m "chore: rapport couverture photo rue Cler"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            echo "Push échoué (essai \${attempt}/3)." >&2
            sleep $((attempt * 2))
          done
          echo "Impossible de pousser les rapports après 3 essais." >&2
          exit 1
