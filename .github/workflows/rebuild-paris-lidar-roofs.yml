name: Rebuild Paris LiDAR roofs
on:
  workflow_dispatch:
    inputs:
      whole_paris:
        description: "Future extension; current build supports one 6x6 km square only"
        type: boolean
        required: true
        default: false
      commit_outputs:
        description: "Commit generated tiles and statistics"
        type: boolean
        required: true
        default: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: paris-lidar-roofs-pr28
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/appart-studio-runtime-lidar-vegetation
          fetch-depth: 0
      - name: Validate coverage input
        run: |
          python - <<'PY'
          import json, os
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          if event.get("inputs",{}).get("whole_paris") == "true":
              raise SystemExit("Paris entier pas encore supporté : le pipeline actuel est limité à un carré de 6x6 km.")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tifffile Pillow shapely mapbox-earcut pyproj
      - name: Resolve 38 rue Cler in Lambert-93
        id: address
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, os
          from pyproj import Transformer
          q=urllib.parse.urlencode({"q":"38 rue Cler, 75007 Paris","limit":1})
          with urllib.request.urlopen("https://api-adresse.data.gouv.fr/search/?"+q,timeout=30) as r: data=json.load(r)
          f=data.get("features",[])
          if not f: raise SystemExit("Adresse BAN introuvable")
          lon,lat=f[0]["geometry"]["coordinates"]
          x,y=Transformer.from_crs("EPSG:4326","EPSG:2154",always_xy=True).transform(lon,lat)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out: out.write(f"x={x:.3f}\ny={y:.3f}\n")
          print(f[0]["properties"].get("label"),x,y)
          PY
      - name: Measure tiles before
        id: before
        run: |
          bytes=0
          if [[ -d data/paris/tuiles ]]; then bytes=$(du -sb data/paris/tuiles | cut -f1); fi
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
      - name: Download IGN MNT/MNH 2m + MNH LiDAR HD 50cm and source data around rue Cler
        env:
          X0: ${{ steps.address.outputs.x }}
          Y0: ${{ steps.address.outputs.y }}
        run: |
          mkdir -p data/paris/source data/paris/tuiles
          python -I outils/dl_ville.py "$X0" "$Y0" data/paris/source
      - name: Generate streamed runtime terrain from MNT LiDAR HD 50 cm
        env:
          X0: ${{ steps.address.outputs.x }}
          Y0: ${{ steps.address.outputs.y }}
        run: |
          python -I outils/terrain_runtime.py data/paris/source data/paris/terrain_hd --x0 "$X0" --y0 "$Y0" --step 4
      - name: Prepare non-committed fallback textures for builder-only outputs
        run: |
          mkdir -p pub/data/tex
          python - <<'PY'
          from PIL import Image, ImageDraw
          import os
          root="pub/data/tex"
          patterns={
            "tuiles":(150,75,55),"ardoise":(75,82,91),"toit_plat":(105,105,100),
            "bitume":(62,62,60),"trottoir":(150,145,135)
          }
          for name,base in patterns.items():
              path=os.path.join(root,name+"_d.jpg")
              if os.path.exists(path): continue
              im=Image.new("RGB",(256,256),base); d=ImageDraw.Draw(im)
              if name=="tuiles":
                  for y in range(0,256,24):
                      off=12 if (y//24)%2 else 0
                      for x in range(-24,280,32):
                          d.arc((x+off,y,x+off+32,y+24),180,360,fill=tuple(max(0,v-28) for v in base),width=2)
              elif name=="ardoise":
                  for y in range(0,256,32):
                      for x in range(0,256,48):
                          d.line((x,y,x+40,y+28),fill=(base[0]+18,base[1]+18,base[2]+18),width=1)
              else:
                  for y in range(0,256,32): d.line((0,y,256,y),fill=tuple(max(0,v-12) for v in base),width=1)
              im.save(path,quality=88)
          PY
      - name: Build LiDAR roofs for the 7th arrondissement test window
        id: build
        env:
          CITY_NAME: paris
          CITY_X0: ${{ steps.address.outputs.x }}
          CITY_Y0: ${{ steps.address.outputs.y }}
          TILES_OUT: data/paris/tuiles
          TEXTURE_DIR: pub/data/tex
        run: |
          rm -rf data/paris/tuiles
          mkdir -p data/paris/tuiles
          start=$(date +%s)
          python -I outils/build.py data/paris/source data/paris
          echo "seconds=$(( $(date +%s)-start ))" >> "$GITHUB_OUTPUT"
      - name: Measure generated tiles and write summary
        id: metrics
        run: |
          after=$(du -sb data/paris/tuiles | cut -f1)
          echo "after=$after" >> "$GITHUB_OUTPUT"
          {
            echo "## Build LiDAR Paris 7e — rue Cler"
            echo "| Mesure | Valeur |"
            echo "|---|---:|"
            echo "| Tuiles avant | ${{ steps.before.outputs.bytes }} octets |"
            echo "| Tuiles après | $after octets |"
            echo "| Durée | ${{ steps.build.outputs.seconds }} secondes |"
            echo "### Statistiques toits"
            cat data/paris/toits_lidar_stats.json
            echo "### Terrain runtime MNT LiDAR HD 50 cm"
            cat data/paris/terrain_hd/index.json
            echo "### Vérification MNH 50 cm"
            python - <<'PY'
            import json
            p=json.load(open("data/paris/toits_lidar_stats.json"))
            print(f"Dalles 50 cm chargées : {p.get('high_resolution_tiles_loaded',0)}/36")
            print("Toitures réellement calculées par résolution :", p.get("resolution_usage_m",{}))
            PY
            echo "Soleil au 38 rue Cler, 2e étage : non mesuré par ce job (21 décembre / 21 juin)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit generated tiles and statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          if event.get("inputs",{}).get("commit_outputs","true") != "true":
              print("commit_outputs=false : pas de commit")
              raise SystemExit(0)
          subprocess.run(["git","config","user.name","github-actions[bot]"],check=True)
          subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=True)
          subprocess.run(["git","add","data/paris/tuiles","data/paris/toits_lidar_stats.json"],check=True)
          if subprocess.run(["git","diff","--cached","--quiet"]).returncode:
              subprocess.run(["git","commit","-m","build(paris): regenerate 7e tiles with LiDAR roofs"],check=True)
              subprocess.run(["git","push","origin","HEAD:feat/appart-studio-runtime-lidar-vegetation"],check=True)
          PY
      - name: Comment measured build metrics on PR 27
        if: always() && steps.metrics.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 28 --repo "$GITHUB_REPOSITORY" --body "Build Paris 7e mesuré : tuiles avant ${{ steps.before.outputs.bytes }} octets ; après ${{ steps.metrics.outputs.after }} octets ; durée ${{ steps.build.outputs.seconds }} s. Soleil 38 rue Cler non mesuré."
