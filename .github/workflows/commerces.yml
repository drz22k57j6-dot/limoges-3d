# Télécharge la base des commerces parisiens (APUR BDCOM 2023) + les commerces OpenStreetMap de Paris,
# puis les dépose compressés dans outils/commerces/ (le bac à sable de Claude n'a pas accès à ces sites).
name: Commerces
on:
  workflow_dispatch:
  push:
    paths: ['outils/commerces/demande.txt']
permissions:
  contents: write
concurrency:
  group: commerces
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        run: |
          set +e
          exec > >(tee outils/commerces/log.txt) 2>&1
          set -x
          pip install openpyxl pandas >/dev/null
          cd outils/commerces
          curl -sS -A "Mozilla/5.0" "https://opendata.apur.org/api/search/v1/collections/all/items?q=bdcom&limit=50" -o hub.json; head -c 3000 hub.json; echo
          python3 - <<'PY'
          import json, subprocess, os
          try:
              d = json.load(open('hub.json'))
          except Exception as e:
              print('hub KO', e); d = {'features': []}
          for f in d.get('features', []):
              p = f.get('properties', {}); t = (p.get('title') or '') ; i = f.get('id')
              print('ITEM', i, t, p.get('type'), p.get('url'))
              if '2023' in t and p.get('type') == 'Feature Service' and p.get('url'):
                  u = p['url'].rstrip('/')
                  if not u.split('/')[-1].isdigit(): u += '/0'
                  out = []; off = 0
                  while True:
                      q = f"{u}/query?where=1%3D1&outFields=*&outSR=4326&f=json&resultOffset={off}&resultRecordCount=2000"
                      r = subprocess.run(['curl', '-sS', '-A', 'Mozilla/5.0', q], capture_output=True, text=True).stdout
                      try: j = json.loads(r)
                      except Exception: print('bad', r[:300]); break
                      feats = j.get('features', [])
                      for g in feats:
                          a = g['attributes']; geo = g.get('geometry') or {}
                          a['_lon'] = geo.get('x'); a['_lat'] = geo.get('y'); out.append(a)
                      off += len(feats)
                      if not feats or not j.get('exceededTransferLimit'): break
                  print(t, len(out))
                  if out:
                      import gzip
                      name = ''.join(c if c.isalnum() else '_' for c in t)[:40]
                      json.dump(out, gzip.open(f'bdcom_{name}.json.gz', 'wt'), ensure_ascii=False)
          PY
          Q='[out:json][timeout:600][bbox:48.815,2.224,48.902,2.470];(nwr["shop"];nwr["amenity"~"^(restaurant|cafe|bar|fast_food|pharmacy|bank|pub|ice_cream|bureau_de_change|post_office|cinema|theatre|nightclub|dentist|doctors)$"];nwr["craft"];nwr["office"~"estate_agent|insurance"];);out center tags;'
          curl -sS -m 600 -A "limoges-3d (github actions)" --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter -o osm.json; head -c 300 osm.json; echo; python3 -c "import json;json.load(open('osm.json'))" || curl -sS -m 600 -A "limoges-3d (github actions)" --data-urlencode "data=$Q" https://overpass.private.coffee/api/interpreter -o osm.json; head -c 300 osm.json
          python3 - <<'PY'
          import json, gzip
          d = json.load(open('osm.json'))
          out = []
          K = ['shop','amenity','craft','office','name','brand','brand:wikidata','addr:housenumber','addr:street','opening_hours','cuisine','outdoor_seating','website']
          for e in d['elements']:
              t = e.get('tags', {}); c = e.get('center', e)
              if 'lat' not in c: continue
              out.append([round(c['lat'],6), round(c['lon'],6)] + [t.get(k,'') for k in K])
          json.dump({'cols': ['lat','lon']+K, 'rows': out}, gzip.open('osm_commerces.json.gz','wt'), ensure_ascii=False, separators=(',',':'))
          print(len(out), 'commerces OSM')
          PY
          rm -f osm.json
          ls -la
      - name: Commit
        run: |
          git config user.name "commerces-bot"; git config user.email "actions@github.com"
          git add outils/commerces; git commit -m "Données commerces (BDCOM + OSM)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
