name: Test façades Paris

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "outils/build.py"
      - ".github/workflows/test-facades-paris.yml"

permissions:
  contents: read

jobs:
  verification:
    name: Vérification statique du moteur de façades
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code de la branche testée
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier la syntaxe Python
        run: python -m py_compile outils/build.py

      - name: Vérifier les façades Paris
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("outils/build.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))

          functions = {
              node.name for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          required_functions = {"facade_paris_bureau", "facade_paris_industrie"}
          missing = required_functions - functions
          assert not missing, f"Fonctions manquantes : {sorted(missing)}"

          required_fragments = [
              "M_PARIS_BUREAU = G.material('facade_paris_bureau'",
              "M_PARIS_INDUSTRIE = G.material('facade_paris_industrie'",
              "('paris_bureau', M_PARIS_BUREAU)",
              "('paris_industrie', M_PARIS_INDUSTRIE)",
              "if _o.environ.get('CITY_NAME') == 'paris' and not small:",
              "if usage == 'Industriel': k = 'paris_industrie'",
              "elif usage == 'Commercial et services' and h >= 10: k = 'paris_bureau'",
          ]
          missing_fragments = [item for item in required_fragments if item not in source]
          assert not missing_fragments, (
              "Éléments de configuration absents :\n- " + "\n- ".join(missing_fragments)
          )

          print("OK : syntaxe Python valide.")
          print("OK : façades bureaux et industrielles présentes.")
          print("OK : matériaux déclarés et inclus dans l'export des tuiles.")
          print("OK : règles de sélection Paris présentes.")
          print("IMPORTANT : ce contrôle est statique ; il ne génère pas les bâtiments 3D.")
          PY
