name: Test façades Paris

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "outils/build.py"
      - ".github/workflows/test-facades-paris.yml"

permissions:
  contents: read

jobs:
  verification:
    name: Contrôle du code et aperçu des textures
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code de la branche testée
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Installer Python et Pillow
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Pillow
        run: python -m pip install Pillow

      - name: Vérifier la syntaxe Python
        run: python -m py_compile outils/build.py

      - name: Vérifier et générer les aperçus des façades
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          from PIL import Image, ImageDraw

          path = Path("outils/build.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))

          wanted = {"facade_haussmann", "facade_paris_bureau", "facade_paris_industrie"}
          nodes = {
              n.name: n for n in tree.body
              if isinstance(n, ast.FunctionDef) and n.name in wanted
          }
          missing = wanted - nodes.keys()
          assert not missing, f"Fonctions manquantes : {sorted(missing)}"

          namespace = {"Image": Image, "ImageDraw": ImageDraw}
          module = ast.Module(body=[nodes[n] for n in sorted(wanted)], type_ignores=[])
          exec(compile(module, str(path), "exec"), namespace)

          out = Path("facades-preview")
          out.mkdir(exist_ok=True)
          names = [
              ("facade_haussmann", "01-haussmann.png"),
              ("facade_paris_bureau", "02-bureaux.png"),
              ("facade_paris_industrie", "03-industrie.png"),
          ]
          for fn, filename in names:
              im = namespace[fn]()
              im.save(out / filename)
              print(f"OK : aperçu généré {filename} ({im.size[0]}x{im.size[1]})")

          print("IMPORTANT : ce sont les textures seules, pas un rendu 3D complet dans le jeu.")
          PY

      - name: Publier les aperçus à consulter
        uses: actions/upload-artifact@v4
        with:
          name: apercu-facades-paris
          path: facades-preview/
          if-no-files-found: error
