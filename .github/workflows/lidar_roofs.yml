name: LiDAR roof synthetic tests
on:
  pull_request:
    paths:
      - "outils/build.py"
      - "outils/toits_lidar.py"
      - "outils/test_toits_lidar.py"
      - ".github/workflows/lidar_roofs.yml"
  push:
    branches:
      - "feat/appart-studio-lidar-real-roofs"
jobs:
  synthetic-roofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependencies
        run: python -m pip install numpy shapely mapbox-earcut
      - name: Compile changed Python files
        run: python -m py_compile outils/build.py outils/toits_lidar.py outils/test_toits_lidar.py
      - name: Run offline synthetic LiDAR tests
        run: python -m unittest discover -s outils -p "test_toits_lidar.py" -v
