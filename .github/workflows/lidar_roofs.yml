name: LiDAR roof synthetic tests
on:
  pull_request:
    paths:
      - "outils/build.py"
      - "outils/toits_lidar.py"
      - "outils/test_toits_lidar.py"
      - "outils/dl_ville.py"
      - "outils/terrain_runtime.py"
      - "outils/test_terrain_runtime.py"
      - ".github/workflows/lidar_roofs.yml"
  push:
    branches:
      - "feat/appart-studio-lidar-real-roofs"
      - "feat/appart-studio-runtime-lidar-vegetation"
jobs:
  synthetic-roofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependencies
        run: python -m pip install numpy shapely mapbox-earcut tifffile Pillow
      - name: Compile changed Python files
        run: python -m py_compile outils/build.py outils/toits_lidar.py outils/test_toits_lidar.py outils/terrain_runtime.py outils/test_terrain_runtime.py
      - name: Verify helper import in isolated Python mode
        run: python -I -c "import os,sys; sys.path.insert(0, os.path.abspath('outils')); import toits_lidar"
      - name: Run offline synthetic LiDAR tests
        run: python -m unittest discover -s outils -p "test_toits_lidar.py" -v
      - name: Run offline runtime terrain tests
        run: python -m unittest discover -s outils -p "test_terrain_runtime.py" -v
